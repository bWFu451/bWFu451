<svg xmlns="http://www.w3.org/2000/svg" width="700" height="60" viewBox="0 0 700 60">
  <style>
    text {
      font-family: 'Fira Code', monospace;
      font-size: 22px;
      text-anchor: middle;
      opacity: 0;
      animation: show 12s infinite;
    }
    @keyframes show {
      0%   { opacity: 0; }
      3%   { opacity: 1; }
      22%  { opacity: 1; }
      25%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .t1 { fill: #F7B731; animation-delay: 0s; }
    .t2 { fill: #E63946; animation-delay: 3s; }
    .t3 { fill: #36BCF7; animation-delay: 6s; }
    .t4 { fill: #F7B731; animation-delay: 9s; }
  </style>
  <text class="t1" x="350" y="38">Genius, billionaire, playboy, philanthropist</text>
  <text class="t2" x="350" y="38">I am Iron Man</text>
  <text class="t3" x="350" y="38">I love you 3000</text>
  <text class="t4" x="350" y="38">Sometimes you gotta run before you can walk</text>
</svg>
